jobs:
  run-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv with python 3.11
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
          python-version: 3.11
          activate-environment: true
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
