[project]
name = "docling-parse"
version = "4.0.4"
description = "Simple package to extract text with coordinates from programmatic PDFs"
authors = [
    {name = "Peter Staar", email = "taa@zurich.ibm.com"},
    {name = "Christoph Auer", email = "cau@zurich.ibm.com"},
    {name = "Michele Dolfi", email = "dol@zurich.ibm.com"},
    {name = "Panos Vagenas", email = "pva@zurich.ibm.com"},
    {name = "Maxim Lysak", email = "mly@zurich.ibm.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["docling", "pdf", "parser"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "tabulate>=0.9.0,<1.0.0",
    "pillow>=10.0.0,<12.0.0",
    "pydantic>=2.0.0",
    "docling-core>=2.23.0",
    "pywin32>=305; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/docling-project/docling-parse"
Repository = "https://github.com/docling-project/docling-parse"

[build-system]
requires = ["setuptools>=65", "wheel", "pybind11>=2.13.1"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
default-groups = "all"

[tool.setuptools.packages.find]
where = ["."]
include = ["docling_parse"]

[tool.setuptools.package-data]
"docling_parse" = [
    "*.so", "*.pyd", "*.dll",
    "pdf_resources/*",
    "pdf_resources_v2/*"
]

[tool.setuptools.exclude-package-data]
"docling_parse" = ["*.pyc", "__pycache__"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312", "py313"]
include = '\.pyi?$'
preview = true

[tool.isort]
profile = "black"
line_length = 88
py_version = 310
multi_line_output = 3
include_trailing_comma = true

[tool.autoflake]
in-place = true
ignore-init-module-imports = true
remove-all-unused-imports = true
remove-unused-variables = true
expand-star-imports = true
recursive = true

[tool.mypy]
pretty = true
no_implicit_optional = true
namespace_packages = true
show_error_codes = true
python_version = "3.9"

[[tool.mypy.overrides]]
module = [
    "tabulate.*",
    "botocore.*",
    "boto3.*"
]
ignore_missing_imports = true

[tool.semantic_release]
version_source = "tag_only"
branch = "main"
parser_angular_allowed_types = "build,chore,ci,docs,feat,fix,perf,style,refactor,test"
parser_angular_minor_types = "feat"
parser_angular_patch_types = "fix,perf"
